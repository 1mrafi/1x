<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-top:25px;
  padding-bottom:120px;
  height:100vh;
  overflow-y:auto;
}

.top-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  border-radius:12px;
  margin-bottom:8px;
}
.top-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

.tabs{
  display:flex;
  margin-bottom:8px;
  background:#020617;
  border-radius:20px;
  padding:4px;
}
.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}
.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

.card{
  background:rgba(2,6,23,0.9);
  padding:20px;
  border-radius:22px;
  margin-top:10px;
}

.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}
.method.active{border:1px solid #0ea5e9;}

.number-card{
  display:none;
  margin-top:10px;
  margin-bottom:10px;
  padding:15px;
  border-radius:18px;
  background:#020617;
  border:1px dashed #0ea5e9;
  text-align:center;
  font-size:18px;
}
.number-card b{
  font-size:22px;
}

.row{
  display:flex;
  gap:8px;
}
.row input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(145deg,#0f172a,#020617);
  border:1px solid rgba(14,165,233,0.3);
  color:white;
  outline:none;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
  font-weight:600;
}

/* FLOAT LEFT */
.float-area{
  position: fixed;
  left: 15px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
}

.site-card{
  width:120px;
  height:55px;
  padding:10px;
  border-radius:14px;
  background:rgba(14,165,233,0.15);
  border:1px solid rgba(14,165,233,0.3);
  text-align:center;
  font-size:12px;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.site-card b{
  font-size:13px;
}

/* WHATSAPP FLOAT */
.float-whatsapp{
  position: fixed;
  right: 15px;
  bottom: 20px;
  z-index: 9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.float-whatsapp .wa-text{
  font-size:12px;
  padding:3px 8px;
  border-radius:10px;
  background:rgba(37,211,102,0.15);
  border:1px solid rgba(37,211,102,0.4);
  color:white;
}

.float-whatsapp a{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.float-whatsapp svg{
  width:28px;
  height:28px;
  fill:white;
}

/* ========================= */
/* ✅ ADDED FIX (NO CHANGE)   */
/* ========================= */

.float-whatsapp{
  transform: translateZ(0);
}

/* safe area support */
@supports (bottom: env(safe-area-inset-bottom)) {
  .float-whatsapp{
    bottom: calc(20px + env(safe-area-inset-bottom));
  }
}

</style>
</head>

<body>

<div class="container">

<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit', event)">Deposit</div>
  <div class="tab" onclick="showTab('withdraw', event)">Withdraw</div>
</div>

<div id="deposit" class="card">

  <div class="methods" id="depositMethods">
    <div class="method active" onclick="selectMethod(this,'deposit')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">রকেট</div>
  </div>

  <div class="number-card" id="numberCard"></div>

  <div class="row">
    <input type="text" id="d_userid" placeholder="ইউজার ID">
    <input type="number" id="d_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="d_last" placeholder="লাস্ট ৪ ডিজিট">
  </div>

  <button class="btn" onclick="sendDeposit()">সাবমিট</button>
</div>

<div id="withdraw" class="card" style="display:none;">

  <div class="methods" id="withdrawMethods">
    <div class="method active" onclick="selectMethod(this,'withdraw')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">রকেট</div>
  </div>

  <div class="row">
    <input type="text" id="w_userid" placeholder="ইউজার ID">
    <input type="number" id="w_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="w_number" placeholder="নাম্বার">
  </div>

  <button class="btn" onclick="sendWithdraw()">সাবমিট</button>
</div>

</div>

<!-- FLOAT LEFT -->
<div class="float-area">
  <div class="site-card" onclick="window.open('https://velki247.live','_blank')">
    <b>ভেল্কি</b>
  </div>

  <div class="site-card" onclick="window.open('https://www.bjwala.co','_blank')">
    <b>বাজিওয়ালা</b>
  </div>

  <div class="site-card" onclick="window.open('https://www.9xbet9.live/','_blank')">
    <b>9xBet</b>
  </div>
</div>

<!-- WHATSAPP -->
<div class="float-whatsapp">

  <div class="wa-text">আকাশ খান</div>

  <a href="https://wa.me/855969610245" target="_blank">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <path d="M19.11 17.53c-.29-.15-1.7-.84-1.96-.93-.26-.09-.45-.15-.64.15-.19.29-.74.93-.9 1.12-.17.19-.33.21-.62.07-.29-.15-1.22-.45-2.32-1.43-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.33.43-.49.15-.17.2-.29.29-.48.1-.19.05-.36-.02-.51-.07-.15-.64-1.55-.88-2.12-.23-.55-.47-.48-.64-.49h-.55c-.19 0-.49.07-.74.36-.26.29-1 1-1 2.43s1.03 2.82 1.17 3.01c.15.19 2.04 3.12 4.95 4.37.69.3 1.23.48 1.65.62.69.22 1.32.19 1.82.12.56-.08 1.7-.69 1.94-1.36.24-.67.24-1.25.17-1.36-.07-.11-.26-.18-.55-.33z"/>
      <path d="M16 3C9.37 3 4 8.37 4 15c0 2.48.72 4.8 1.97 6.75L4 29l7.4-1.94C13.28 28.38 14.6 28.6 16 28.6c6.63 0 12-5.37 12-12S22.63 3 16 3zm0 22.6c-1.25 0-2.45-.23-3.55-.65l-.25-.1-4.4 1.15 1.18-4.29-.16-.26C7.5 19.2 6.6 17.18 6.6 15 6.6 9.73 10.73 5.6 16 5.6S25.4 9.73 25.4 15 21.27 25.6 16 25.6z"/>
    </svg>
  </a>

</div>

<!-- ========================= -->
<!-- ✅ ADDED JS FIX ONLY      -->
<!-- ========================= -->
<script>
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const wa = document.querySelector('.float-whatsapp');
    const vhDiff = window.innerHeight - window.visualViewport.height;

    if (vhDiff > 0) {
      wa.style.bottom = (20 + vhDiff) + "px";
    } else {
      wa.style.bottom = "20px";
    }
  });
}
</script>

</body>
</html>
