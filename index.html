<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

html,body{
  height:100%;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-top:25px;     /* 🔥 top gap fix */
  padding-bottom:120px; /* 🔥 floating space */
}

/* top note */
.top-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  margin-bottom:8px; /* 🔥 reduced */
}

.top-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

/* tabs */
.tabs{
  display:flex;
  margin-bottom:8px; /* 🔥 reduced */
  background:#020617;
  border-radius:20px;
  padding:4px;
}

.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}

.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

/* card */
.card{
  background:rgba(2,6,23,0.9);
  padding:18px;
  border-radius:22px;
  box-shadow:0 15px 40px rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.05);
  margin-top:6px; /* 🔥 gap fix */
}

/* methods */
.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}

.method.active{border:1px solid #0ea5e9;}

/* number card */
.number-card{
  display:none;
  margin-top:10px;
  margin-bottom:10px;
  padding:15px;
  border-radius:18px;
  background:#020617;
  border:1px dashed #0ea5e9;
  text-align:center;
}

/* inputs */
.row{
  display:flex;
  gap:8px;
}

.row input{
  flex:1;
  min-width:0;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#020617;
  color:white;
}

/* button */
.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
  font-weight:600;
}

/* FLOATING AREA */
.float-area{
  position:fixed;
  bottom:110px;   /* 🔥 moved up */
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 30px);
  max-width:380px;

  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  animation: floatUpDown 3s ease-in-out infinite;
  z-index:999;
}

@keyframes floatUpDown{
  0%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(-6px);}
  100%{transform:translateX(-50%) translateY(0);}
}

/* ticker */
.left-btn{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  padding:10px 15px;
  border-radius:20px;
  width:160px;
  overflow:hidden;
  white-space:nowrap;
}

.ticker{
  display:inline-block;
  white-space:nowrap;
  animation: scrollLoop 7s linear infinite;
}

@keyframes scrollLoop{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* whatsapp */
.whatsapp-box{
  text-align:center;
}

.whatsapp{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  justify-content:center;
  align-items:center;
}
</style>
</head>

<body>

<div class="container">

<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit')">Deposit</div>
  <div class="tab" onclick="showTab('withdraw')">Withdraw</div>
</div>

<!-- Deposit -->
<div id="deposit" class="card">

  <div class="methods">
    <div class="method active" onclick="selectMethod(this)">বিকাশ</div>
    <div class="method" onclick="selectMethod(this)">নগদ</div>
    <div class="method" onclick="selectMethod(this)">রকেট</div>
  </div>

  <div class="number-card" id="numberCard"></div>

  <div class="row">
    <input type="text" placeholder="ইউজার ID">
    <input type="number" placeholder="টাকার পরিমাণ">
    <input type="text" placeholder="লাস্টের চারটি সংখ্যা">
  </div>

  <button class="btn">সাবমিট</button>
</div>

<!-- Withdraw -->
<div id="withdraw" class="card" style="display:none;">

  <div class="methods">
    <div class="method active">বিকাশ</div>
    <div class="method">নগদ</div>
    <div class="method">রকেট</div>
  </div>

  <div class="row">
    <input type="text" placeholder="ইউজার ID">
    <input type="number" placeholder="টাকার পরিমাণ">
    <input type="text" placeholder="নাম্বার">
  </div>

  <button class="btn">সাবমিট</button>
</div>

</div>

<!-- FLOATING -->
<div class="float-area">

  <div class="left-btn">
    <div class="ticker">
      বাজিওয়াল 9xbet ভেল্কি সকল সাইডের লিংক সমূহ • বাজিওয়াল 9xbet •
    </div>
  </div>

  <div class="whatsapp-box">
    <div style="font-size:12px;">আকাশ খান</div>
    <div class="whatsapp">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" width="30">
    </div>
  </div>

</div>

<script>
function selectMethod(el){
  document.querySelectorAll('.method').forEach(m=>m.classList.remove('active'));
  el.classList.add('active');

  let text = "";

  if(el.innerText === "বিকাশ"){
    text = "বিকাশ এজেন্ট নাম্বার<br><b>01316616956</b><br><small>ক্যাশ আউট করুন</small>";
  }
  else if(el.innerText === "নগদ"){
    text = "নগদ এজেন্ট নাম্বার<br><b>01316616956</b><br><small>ক্যাশ আউট করুন</small>";
  }
  else if(el.innerText === "রকেট"){
    text = "রকেট এজেন্ট নাম্বার<br><b>01316616956</b><br><small>ক্যাশ আউট করুন</small>";
  }

  document.getElementById('numberCard').innerHTML = text;
  document.getElementById('numberCard').style.display = 'block';
}

function showTab(tab){
  document.getElementById('deposit').style.display='none';
  document.getElementById('withdraw').style.display='none';
  document.getElementById(tab).style.display='block';

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
}
</script>

</body>
</html>
