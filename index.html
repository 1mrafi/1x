<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-top:25px;
  padding-bottom:120px;
  height:100vh;
  overflow-y:auto;
}

.top-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  border-radius:12px;
  margin-bottom:8px;
}
.top-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

.tabs{
  display:flex;
  margin-bottom:8px;
  background:#020617;
  border-radius:20px;
  padding:4px;
}
.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}
.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

.card{
  background:rgba(2,6,23,0.9);
  padding:20px;
  border-radius:22px;
  margin-top:10px;
}

.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}
.method.active{border:1px solid #0ea5e9;}

.number-card{
  display:none;
  margin-top:10px;
  margin-bottom:10px;
  padding:15px;
  border-radius:18px;
  background:#020617;
  border:1px dashed #0ea5e9;
  text-align:center;
  font-size:18px;
}
.number-card b{
  font-size:22px;
}

.row{
  display:flex;
  gap:8px;
}
.row input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(145deg,#0f172a,#020617);
  border:1px solid rgba(14,165,233,0.3);
  color:white;
  outline:none;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
  font-weight:600;
}

.float-area{
  position: fixed;
  left: 15px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
}

.site-card{
  width:120px;
  height:55px;
  padding:10px;
  border-radius:14px;
  background:rgba(14,165,233,0.15);
  border:1px solid rgba(14,165,233,0.3);
  text-align:center;
  font-size:12px;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.site-card b{
  font-size:13px;
}

/* WHATSAPP */
.float-whatsapp{
  position: fixed;
  right: 15px;
  bottom: 20px;
  z-index: 9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.float-whatsapp .wa-text{
  font-size:12px;
  padding:3px 8px;
  border-radius:10px;
  background:rgba(37,211,102,0.15);
  border:1px solid rgba(37,211,102,0.4);
  color:white;
}

.float-whatsapp a{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.float-whatsapp svg{
  width:28px;
  height:28px;
  fill:white;
}

/* ================= SUCCESS POPUP ================= */

.success-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.success-modal{
  width:280px;
  padding:20px;
  border-radius:20px;
  background:rgba(2,6,23,0.95);
  border:1px solid #0ea5e9;
  text-align:center;
  animation:pop 0.3s ease;
}

@keyframes pop{
  from{transform:scale(0.6); opacity:0;}
  to{transform:scale(1); opacity:1;}
}

.tick{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#25D366;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.success-text{
  font-size:14px;
  margin-top:10px;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="container">

<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit', event)">Deposit</div>
  <div class="tab" onclick="showTab('withdraw', event)">Withdraw</div>
</div>

<div id="deposit" class="card">

  <div class="methods" id="depositMethods">
    <div class="method active" onclick="selectMethod(this,'deposit')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">রকেট</div>
  </div>

  <div class="number-card" id="numberCard"></div>

  <div class="row">
    <input type="text" id="d_userid" placeholder="ইউজার ID">
    <input type="number" id="d_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="d_last" placeholder="লাস্ট ৪ ডিজিট">
  </div>

  <button class="btn" onclick="sendDeposit()">সাবমিট</button>
</div>

<div id="withdraw" class="card" style="display:none;">

  <div class="methods" id="withdrawMethods">
    <div class="method active" onclick="selectMethod(this,'withdraw')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">রকেট</div>
  </div>

  <div class="row">
    <input type="text" id="w_userid" placeholder="ইউজার ID">
    <input type="number" id="w_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="w_number" placeholder="নাম্বার">
  </div>

  <button class="btn" onclick="sendWithdraw()">সাবমিট</button>
</div>

</div>

<!-- FLOAT LEFT -->
<div class="float-area">
  <div class="site-card" onclick="window.open('https://velki247.live','_blank')">
    <b>ভেল্কি</b>
  </div>

  <div class="site-card" onclick="window.open('https://www.bjwala.co','_blank')">
    <b>বাজিওয়ালা</b>
  </div>

  <div class="site-card" onclick="window.open('https://www.9xbet9.live/','_blank')">
    <b>9xBet</b>
  </div>
</div>

<!-- WHATSAPP -->
<div class="float-whatsapp">
  <div class="wa-text">আকাশ খান</div>
  <a href="https://wa.me/855969610245" target="_blank">
    <svg viewBox="0 0 32 32">
      <path d="M19.11 17.53c-.29-.15-1.7-.84-1.96-.93-.26-.09-.45-.15-.64.15-.19.29-.74.93-.9 1.12-.17.19-.33.21-.62.07-.29-.15-1.22-.45-2.32-1.43-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.6.13-.13.29-.33.43-.49.15-.17.2-.29.29-.48.1-.19.05-.36-.02-.51-.07-.15-.64-1.55-.88-2.12-.23-.55-.47-.48-.64-.49h-.55c-.19 0-.49.07-.74.36-.26.29-1 1-1 2.43s1.03 2.82 1.17 3.01c.15.19 2.04 3.12 4.95 4.37.69.3 1.23.48 1.65.62.69.22 1.32.19 1.82.12.56-.08 1.7-.69 1.94-1.36.24-.67.24-1.25.17-1.36-.07-.11-.26-.18-.55-.33z"/>
    </svg>
  </a>
</div>

<!-- SUCCESS OVERLAY -->
<div class="success-overlay" id="successOverlay">
  <div class="success-modal">
    <div class="tick">✔</div>
    <div class="success-text" id="successText"></div>
  </div>
</div>

<script>

function playSound(){
  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  audio.play();
}

function showSuccess(id, method, user, amount){
  document.getElementById("successText").innerHTML =
  "🆔 " + id + "<br>💳 " + method + "<br>👤 " + user + "<br>💰 " + amount;

  document.getElementById("successOverlay").style.display="flex";

  playSound();

  setTimeout(()=>{
    document.getElementById("successOverlay").style.display="none";
  },2500);
}

</script>

</body>
</html>
