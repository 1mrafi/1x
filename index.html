<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

html,body{
  height:100%;
  overflow-x:hidden; /* FIX OUTSIDE SCROLL */
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-top:25px;
  padding-bottom:120px;
  overflow:hidden; /* EXTRA SAFETY */
}

/* TOP SLIDER (UNCHANGED AS YOU SAID) */
.top-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  border-radius:12px;
  margin-bottom:8px;
}
.top-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

/* TABS */
.tabs{
  display:flex;
  margin-bottom:8px;
  background:#020617;
  border-radius:20px;
  padding:4px;
}
.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}
.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

/* CARD */
.card{
  background:rgba(2,6,23,0.9);
  padding:20px;
  border-radius:22px;
  margin-top:10px;
}

/* METHODS */
.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}
.method.active{border:1px solid #0ea5e9;}

/* INPUT FIX (NO OUTSIDE FLOW) */
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap; /* IMPORTANT FIX */
}
.row input{
  flex:1;
  min-width:0;
  width:100%;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(145deg,#0f172a,#020617);
  border:1px solid rgba(14,165,233,0.3);
  color:white;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
  font-weight:600;
}

/* FLOAT AREA */
.float-area{
  position:fixed;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 30px);
  max-width:380px;
  display:flex;
  justify-content:space-between;
}

/* WHATSAPP */
.whatsapp{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* BOTTOM BUTTONS (REPLACE SLIDER AREA) */
.bottom-links{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 30px);
  max-width:380px;
  display:flex;
  gap:6px;
  justify-content:space-between;
}

.bottom-links a{
  flex:1;
  text-decoration:none;
  text-align:center;
  padding:10px 6px;
  border-radius:12px;
  background:rgba(14,165,233,0.15);
  border:1px solid rgba(14,165,233,0.25);
  color:white;
  font-size:12px;
  white-space:nowrap;
}
</style>
</head>

<body>

<div class="container">

<!-- TOP SLIDER (UNCHANGED) -->
<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit', event)">Deposit</div>
  <div class="tab" onclick="showTab('withdraw', event)">Withdraw</div>
</div>

<!-- DEPOSIT -->
<div id="deposit" class="card">

  <div class="methods" id="depositMethods">
    <div class="method active" onclick="selectMethod(this,'deposit')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">রকেট</div>
  </div>

  <div class="row">
    <input type="text" id="d_userid" placeholder="ইউজার ID">
    <input type="number" id="d_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="d_last" placeholder="লাস্ট ৪ ডিজিট">
  </div>

  <button class="btn" onclick="sendDeposit()">সাবমিট</button>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="card" style="display:none;">

  <div class="methods" id="withdrawMethods">
    <div class="method active" onclick="selectMethod(this,'withdraw')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">রকেট</div>
  </div>

  <div class="row">
    <input type="text" id="w_userid" placeholder="ইউজার ID">
    <input type="number" id="w_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="w_number" placeholder="নাম্বার">
  </div>

  <button class="btn" onclick="sendWithdraw()">সাবমিট</button>
</div>

</div>

<!-- FLOAT -->
<div class="float-area">
  <div></div>

  <a href="https://wa.me/+855969610245" target="_blank">
    <div class="whatsapp">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" width="30">
    </div>
  </a>
</div>

<!-- BOTTOM LINKS (NEW) -->
<div class="bottom-links">
  <a href="https://bjwala.co" target="_blank">Bjwala</a>
  <a href="https://9xbet9.live" target="_blank">9xbet</a>
  <a href="https://velki247.live" target="_blank">Velki</a>
</div>

<script>
const botToken = "8216213984:AAFCOQsGouXgnit2vKWR6Rv8-VonSYL7_irk";
const chatId = "8406979793";

let orderCounter = 23;
let selectedDeposit = "বিকাশ";
let selectedWithdraw = "বিকাশ";

function generateOrderId(){
  return "#" + (orderCounter++);
}

/* RESET */
function resetDeposit(){
  d_userid.value="";
  d_amount.value="";
  d_last.value="";
}

function resetWithdraw(){
  w_userid.value="";
  w_amount.value="";
  w_number.value="";
}

/* DEPOSIT */
function sendDeposit(){
  let id = generateOrderId();

  let msg = `📥 Deposit
🆔 ${id}
💳 ${selectedDeposit}
👤 ${d_userid.value}
💰 ${d_amount.value}
🔢 ${d_last.value}`;

  sendToTelegram(msg);
  resetDeposit();
}

/* WITHDRAW */
function sendWithdraw(){
  let id = generateOrderId();

  let msg = `📤 Withdraw
🆔 ${id}
💳 ${selectedWithdraw}
👤 ${w_userid.value}
💰 ${w_amount.value}
📱 ${w_number.value}`;

  sendToTelegram(msg);
  resetWithdraw();
}

function sendToTelegram(message){
  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:chatId,text:message})
  });
}

function selectMethod(el,type){
  let parent = type==='deposit'?depositMethods:withdrawMethods;
  parent.querySelectorAll('.method').forEach(m=>m.classList.remove('active'));
  el.classList.add('active');

  if(type==='deposit') selectedDeposit = el.innerText;
  else selectedWithdraw = el.innerText;
}

function showTab(tab,e){
  deposit.style.display='none';
  withdraw.style.display='none';
  document.getElementById(tab).style.display='block';
}
</script>

</body>
</html>
